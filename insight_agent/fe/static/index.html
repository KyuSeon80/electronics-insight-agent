<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="생산·품질·시장 데이터를 잇는 인과 분석 및 불량-매출 우선조치 대시보드" />
<title>제조-시장 인과 인사이트 에이전트</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M7 21 L13 13 L18 17 L25 8' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">제조-시장 인과 인사이트 에이전트</div>
    <div class="topbar-controls">
      <select id="product-select"><option value="">제품 선택...</option></select>
      <button id="run-btn">분석 실행</button>
      <span id="run-status" class="status-text"></span>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="prd">PRD</button>
    <button class="tab-btn" data-tab="trace">트레이스</button>
    <button class="tab-btn" data-tab="hitl">승인 큐 (HITL)</button>
    <button class="tab-btn" data-tab="hotl">HOTL 모니터</button>
    <button class="tab-btn" data-tab="priority">우선조치 대시보드</button>
  </nav>

  <main>
    <section id="tab-prd" class="tab-panel active">
      <div id="prd-content" class="markdown-body">불러오는 중...</div>
    </section>

    <section id="tab-trace" class="tab-panel">
      <div class="split">
        <div class="split-left">
          <h3>실행 이력</h3>
          <div id="run-list" class="list"></div>
        </div>
        <div class="split-right">
          <h3>트레이스 상세</h3>
          <div id="run-detail" class="timeline">왼쪽에서 실행 이력을 선택하세요.</div>
        </div>
      </div>
    </section>

    <section id="tab-hitl" class="tab-panel">
      <div class="subtabs">
        <button class="subtab-btn active" data-status="pending">대기중</button>
        <button class="subtab-btn" data-status="approved">승인됨</button>
        <button class="subtab-btn" data-status="rejected">반려됨</button>
      </div>
      <table class="data-table" id="approval-table">
        <thead>
          <tr>
            <th>승인 ID</th><th>제품</th><th>카테고리</th><th>Critical 결함</th>
            <th>최근 점유율</th><th>요약</th><th></th>
          </tr>
        </thead>
        <tbody id="approval-body"></tbody>
      </table>
    </section>

    <section id="tab-hotl" class="tab-panel">
      <div class="hotl-header">
        <h3>리전 x 카테고리 시장점유율 모니터</h3>
        <button id="hotl-refresh-btn">새로고침</button>
      </div>
      <div id="hotl-message" class="status-text"></div>
      <h4>알림 (전분기 대비 급락)</h4>
      <table class="data-table" id="hotl-alert-table">
        <thead><tr><th>리전</th><th>카테고리</th><th>분기</th><th>변화폭(%p)</th></tr></thead>
        <tbody id="hotl-alert-body"></tbody>
      </table>
      <h4>전체 추이</h4>
      <table class="data-table" id="hotl-trend-table">
        <thead><tr><th>리전</th><th>카테고리</th><th>분기</th><th>평균 점유율(%)</th></tr></thead>
        <tbody id="hotl-trend-body"></tbody>
      </table>
    </section>

    <section id="tab-priority" class="tab-panel">
      <div class="hotl-header">
        <h3>불량-매출 영향도 우선조치 랭킹</h3>
        <div class="priority-controls">
          <select id="priority-groupby">
            <option value="product_id">product_id</option>
            <option value="equipment_id">equipment_id</option>
            <option value="factory_code">factory_code</option>
          </select>
          <input id="priority-topn" type="number" min="1" max="100" value="10" />
          <button id="priority-refresh-btn">새로고침</button>
        </div>
      </div>
      <div id="priority-message" class="status-text"></div>
      <div id="priority-barchart" class="priority-barchart"></div>
      <table class="data-table" id="priority-table">
        <thead>
          <tr>
            <th>#</th><th id="priority-group-col-header">product_id</th><th>이름</th>
            <th>영향도 점수</th><th>상관계수</th><th>누적 매출(원)</th><th>표본</th><th></th>
          </tr>
        </thead>
        <tbody id="priority-body"></tbody>
      </table>

      <div id="priority-drilldown" class="priority-drilldown" style="display:none;">
        <h4>월별 불량률 vs 시장점유율 -- <span id="priority-drilldown-title"></span></h4>
        <div id="priority-chart"></div>

        <h4>불량률을 낮추면 매출은 어떻게 될까? (what-if 회귀분석)</h4>
        <div class="priority-whatif-controls">
          <label>목표 불량률(%): <input id="whatif-target" type="number" step="0.1" min="0" /></label>
          <button id="whatif-recalc-btn">다시 계산</button>
        </div>
        <div id="whatif-summary" class="whatif-summary"></div>
        <div id="whatif-chart"></div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
